name: Test and publish Docker image

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: meinya/dedup

jobs:
  checks:
    name: Go checks and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test with race detection
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build command
        run: go build -o "$RUNNER_TEMP/dedup" ./cmd/dedup
      - name: Validate workflow and smoke script
        env:
          GOTOOLCHAIN: auto
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck scripts/ci/docker-smoke.sh

  image:
    name: Build, smoke-test and publish image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      LOCAL_IMAGE: dedup-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image version
        id: version
        run: |
          {
            echo "short=${GITHUB_SHA:0:7}"
            echo "message=$(git show -s --format=%s)"
            echo "time=$(git show -s --format=%cI)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            COMMIT_MESSAGE=${{ steps.version.outputs.message }}
            COMMIT_TIME=${{ steps.version.outputs.time }}
          cache-from: type=gha,scope=dedup-amd64
          cache-to: type=gha,mode=max,scope=dedup-amd64
      - name: Smoke-test dry run and file cleanup
        run: bash scripts/ci/docker-smoke.sh
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image with a commit tag
        id: publish
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.short }}
        run: |
          docker tag "$LOCAL_IMAGE" "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          reference="$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')"
          digest="${reference##*@}"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Published image digest could not be verified.'
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE:$VERSION ($digest)." >> "$GITHUB_STEP_SUMMARY"

  latest:
    name: Update default-branch latest tag
    needs: image
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: dockerhub-latest
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote only the current default-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          head_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          if [[ "$head_sha" != "$EXPECTED_SHA" ]]; then
            echo '::notice::Default branch advanced; keeping this image under its commit tag only.'
            echo 'Skipped latest: this commit is no longer the default-branch head.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          echo "Updated $IMAGE:latest from $EXPECTED_SHA." >> "$GITHUB_STEP_SUMMARY"
